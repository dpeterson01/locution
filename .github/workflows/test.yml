name: "test"
on:
  workflow_dispatch:
  push:
    branches: [main]
    paths:
      - "src-tauri/**"
      - "package.json"
      - "bun.lock"
      - ".github/workflows/test.yml"
  pull_request:
    paths:
      - "src-tauri/**"
      - "package.json"
      - "bun.lock"
      - ".github/workflows/test.yml"

concurrency:
  group: ${{ github.workflow }}-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: true

jobs:
  # One job per shipped desktop platform, run in parallel.
  rust-tests:
    strategy:
      fail-fast: false
      matrix:
        include:
          - platform: macos-latest
            cache-target: target
          - platform: windows-latest
            # CARGO_TARGET_DIR is moved to <drive>\t below; rust-cache resolves
            # the target relative to ./src-tauri, so climb out of the checkout.
            cache-target: ../../../../t
    runs-on: ${{ matrix.platform }}
    steps:
      - name: Enable long paths (Windows)
        if: runner.os == 'Windows'
        shell: pwsh
        run: |
          New-ItemProperty -Path "HKLM:\SYSTEM\CurrentControlSet\Control\FileSystem" `
            -Name "LongPathsEnabled" -Value 1 -PropertyType DWORD -Force
          git config --system core.longpaths true

      - uses: actions/checkout@v5

      - uses: oven-sh/setup-bun@v2
        with:
          bun-version: latest

      # transcribe-cpp builds ggml's Vulkan backend on Windows x64 (see
      # src-tauri/Cargo.toml). Same SDK version as build.yml.
      - name: Install Vulkan SDK (Windows)
        if: runner.os == 'Windows'
        uses: humbletim/install-vulkan-sdk@v1.2
        with:
          version: 1.4.309.0
          cache: true

      # ggml-vulkan needs a findable SPIRV-HeadersConfig.cmake, which the SDK
      # install does not expose. Same vcpkg workaround as build.yml.
      - name: Install SPIRV-Headers (Windows)
        if: runner.os == 'Windows'
        shell: pwsh
        run: |
          vcpkg install spirv-headers:x64-windows
          if ($LASTEXITCODE -ne 0) { throw "vcpkg install spirv-headers failed" }
          $prefix = "$env:VCPKG_INSTALLATION_ROOT/installed/x64-windows" -replace '\\','/'
          $combined = if ($env:CMAKE_PREFIX_PATH) { "$prefix;$env:CMAKE_PREFIX_PATH" } else { $prefix }
          Add-Content $env:GITHUB_ENV "CMAKE_PREFIX_PATH=$combined"

      # transcribe-cpp-sys cmake builds create paths that exceed Windows MAX_PATH
      # (260 chars). Shorten the target dir to keep paths under the limit.
      - name: Shorten build path (Windows)
        if: runner.os == 'Windows'
        shell: pwsh
        run: |
          $drive = Split-Path -Qualifier $env:GITHUB_WORKSPACE
          $targetDir = "$drive\t"
          New-Item -ItemType Directory -Force -Path $targetDir | Out-Null
          echo "CARGO_TARGET_DIR=$targetDir" >> $env:GITHUB_ENV

      - uses: swatinem/rust-cache@v2
        with:
          workspaces: "./src-tauri -> ${{ matrix.cache-target }}"

      - name: Run Rust checks
        run: bun run check:rust

      - name: Run Rust tests
        run: bun run test:rust
