# Nix CI — two tiers:
#
# 1. Quick checks (bun.nix sync, flake eval) run on ANY source change
#    so compilation-breaking edits are caught by flake eval.
# 2. Full nix build (~25 min) only runs when nix packaging files change.
#
# Setting up a Cachix binary cache would further reduce full-build times.

name: "nix build check"
on:
  workflow_dispatch:
  push:
    branches: [main]
    paths:
      - "flake.nix"
      - "flake.lock"
      - ".nix/**"
      - "package.json"
      - "bun.lock"
      - "src-tauri/**"
      - "src/**"
      - ".github/workflows/**"
  pull_request:
    paths:
      - "flake.nix"
      - "flake.lock"
      - ".nix/**"
      - "package.json"
      - "bun.lock"
      - "src-tauri/**"
      - "src/**"
      - ".github/workflows/**"

concurrency:
  group: ${{ github.workflow }}-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: true

jobs:
  nix-build:
    runs-on: ubuntu-24.04
    continue-on-error: false
    steps:
      - uses: actions/checkout@v5

      - uses: oven-sh/setup-bun@v2
        with:
          bun-version: latest

      - uses: cachix/install-nix-action@v31
        with:
          nix_path: nixpkgs=channel:nixos-unstable

      - uses: DeterminateSystems/magic-nix-cache-action@565684385bcd71bad329742eefe8d12f2e765b39 # v13

      - name: Run Nix checks
        run: bun run check:nix

      # Detect whether Nix packaging files changed. Source-only changes stop
      # after the quick checks, while manual runs always perform a full build.
      - name: Check if nix files changed
        if: github.event_name == 'pull_request' || github.event_name == 'push'
        id: nix-files
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          if [[ "${{ github.event_name }}" == "pull_request" ]]; then
            files=$(gh api repos/${{ github.repository }}/pulls/${{ github.event.pull_request.number }}/files \
              --paginate --jq '.[].filename')
          else
            files=$(gh api repos/${{ github.repository }}/compare/${{ github.event.before }}...${{ github.sha }} \
              --jq '.files[].filename')
          fi

          if grep -qE '^(flake\.(nix|lock)|\.nix/|bun\.lock|src-tauri/(Cargo\.(toml|lock)|tauri\.conf\.json|build\.rs))' <<< "$files"; then
            echo "changed=true" >> "$GITHUB_OUTPUT"
          fi

      # Full build — catches runtime build errors (broken dependencies,
      # sandbox issues, compilation failures) that flake eval alone misses.
      # On PRs and pushes: only runs when Nix packaging files change.
      # On workflow_dispatch: always runs for explicit full-build verification.
      - name: Build handy
        if: steps.nix-files.outputs.changed == 'true' || github.event_name == 'workflow_dispatch' || github.event_name == 'push'
        run: nix build .#handy -L --show-trace
