# Nix CI — two tiers:
#
# 1. Quick checks (bun.nix sync, flake eval) run on any packaging-related
#    source change to catch generated dependency and evaluation errors.
# 2. Full nix build runs only when package inputs change. Release-only version
#    bumps skip it, while manual runs always perform explicit verification.

name: "nix build check"
on:
  workflow_dispatch:
  push:
    branches: [main]
    paths:
      - "flake.nix"
      - "flake.lock"
      - ".nix/**"
      - "package.json"
      - "bun.lock"
      - "src-tauri/**"
      - "src/**"
      - ".github/workflows/**"
  pull_request:
    paths:
      - "flake.nix"
      - "flake.lock"
      - ".nix/**"
      - "package.json"
      - "bun.lock"
      - "src-tauri/**"
      - "src/**"
      - ".github/workflows/**"

permissions:
  contents: read

concurrency:
  group: ${{ github.workflow }}-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: true

jobs:
  nix-build:
    runs-on: ubuntu-24.04
    continue-on-error: false
    steps:
      - uses: actions/checkout@fbc6f3992d24b796d5a048ff273f7fcc4a7b6c09 # v5
        with:
          fetch-depth: 0

      - uses: oven-sh/setup-bun@0c5077e51419868618aeaa5fe8019c62421857d6 # v2.2.0
        with:
          bun-version: 1.3.14

      - uses: cachix/install-nix-action@13d8dd58da0234aa297dedd986986ccb8e7f3e24 # v31.11.1
        with:
          nix_path: nixpkgs=channel:nixos-unstable

      - name: Configure Cachix read-only
        if: >-
          !((github.event_name == 'push' || github.event_name == 'workflow_dispatch') &&
          github.ref == 'refs/heads/main')
        uses: cachix/cachix-action@38b082610b782e7e93e209c35fd730d399dee866 # v17
        with:
          name: locution
          skipPush: true

      - name: Configure Cachix writes
        if: >-
          (github.event_name == 'push' || github.event_name == 'workflow_dispatch') &&
          github.ref == 'refs/heads/main'
        uses: cachix/cachix-action@38b082610b782e7e93e209c35fd730d399dee866 # v17
        with:
          name: locution
          authToken: ${{ secrets.CACHIX_AUTH_TOKEN }}

      - name: Run Nix checks
        run: bun run check:nix

      # Detect whether Nix package inputs changed. Manual runs skip this step
      # and always perform a full build below.
      - name: Check if nix files changed
        if: github.event_name == 'pull_request' || github.event_name == 'push'
        id: nix-files
        run: |
          if [[ "${{ github.event_name }}" == "pull_request" ]]; then
            base_sha="${{ github.event.pull_request.base.sha }}"
          else
            base_sha="${{ github.event.before }}"
          fi

          changed=false
          if [[ ! "$base_sha" =~ ^[0-9a-f]{40}$ || "$base_sha" =~ ^0+$ ]] || \
             ! git cat-file -e "$base_sha^{commit}"; then
            changed=true
          elif ! files=$(git diff --name-only --no-renames "$base_sha" "${{ github.sha }}"); then
            changed=true
          elif grep -qE '^(flake\.(nix|lock)|\.nix/|bun\.lock|src-tauri/(Cargo\.(toml|lock)|build\.rs))' <<< "$files"; then
            changed=true
          else
            version_only_change() {
              local config_path="$1"
              local label="$2"
              local base_file="$RUNNER_TEMP/$label-base.json"
              local current_file="$RUNNER_TEMP/$label-current.json"
              local base_normalized="$RUNNER_TEMP/$label-base-normalized.json"
              local current_normalized="$RUNNER_TEMP/$label-current-normalized.json"

              [[ -f "$config_path" ]] && \
                git show "$base_sha:$config_path" > "$base_file" && \
                jq -e '.version | type == "string"' "$base_file" > /dev/null && \
                jq -e '.version | type == "string"' "$config_path" > /dev/null && \
                jq -S 'del(.version)' "$base_file" > "$base_normalized" && \
                jq -S 'del(.version)' "$config_path" > "$current_normalized" && \
                cmp -s "$base_normalized" "$current_normalized"
            }

            if grep -qx 'package.json' <<< "$files" && \
               ! version_only_change package.json package; then
              changed=true
            fi
            if grep -qx 'src-tauri/tauri.conf.json' <<< "$files" && \
               ! version_only_change src-tauri/tauri.conf.json tauri; then
              changed=true
            fi
          fi

          echo "changed=$changed" >> "$GITHUB_OUTPUT"

      # Full build — catches runtime build errors (broken dependencies,
      # sandbox issues, compilation failures) that flake eval alone misses.
      # On PRs and pushes: only runs when Nix packaging files change.
      # On workflow_dispatch: always runs for explicit full-build verification.
      - name: Build handy
        if: steps.nix-files.outputs.changed == 'true' || github.event_name == 'workflow_dispatch'
        timeout-minutes: 120
        run: nix build .#handy -L --show-trace
